name: Build SAG Race Time Android (APK & AAB)

on:
  workflow_dispatch:
    inputs:
      sync_server_url:
        description: 'URL server sinkronisasi (HTTPS)'
        required: false
        default: 'https://ais-pre-eqotcbgnleuatzyizx6i4f-357964425179.asia-east1.run.app'
      version_name:
        description: 'Versi aplikasi (contoh: 1.0.0)'
        required: false
        default: '1.0.0'
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build web bundle
        env:
          VITE_API_URL: ${{ github.event.inputs.sync_server_url || vars.VITE_API_URL || 'https://ais-pre-eqotcbgnleuatzyizx6i4f-357964425179.asia-east1.run.app' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run lint
          npm run build

      - name: Wrap with Capacitor & configure GPS/Sensor permissions
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
        run: |
          npm install --no-save --legacy-peer-deps --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sag.racetime",
            "appName": "SAG Race Time",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          rm -rf android
          ./node_modules/.bin/cap add android
          ./node_modules/.bin/cap sync android
          node --input-type=module -e '
            import fs from "fs";
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            const perms = [
              "<uses-permission android:name=\"android.permission.INTERNET\" />",
              "<uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />",
              "<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />",
              "<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />",
              "<uses-permission android:name=\"android.permission.WAKE_LOCK\" />",
              "<uses-feature android:name=\"android.hardware.location.gps\" android:required=\"false\" />"
            ];
            for (const p of perms) {
              if (!xml.includes(p)) {
                xml = xml.replace("<application", p + "\n    <application");
              }
            }
            fs.writeFileSync(manifestPath, xml);

            const gradlePath = "android/app/build.gradle";
            let gradle = fs.readFileSync(gradlePath, "utf8");
            const vCode = process.env.APP_VERSION_CODE || "1";
            const vName = process.env.APP_VERSION_NAME || "1.0.0";
            gradle = gradle
              .replace(/versionCode\s+\d+/, `versionCode ${vCode}`)
              .replace(/versionName\s+"[^"]*"/, `versionName "${vName}"`);
            fs.writeFileSync(gradlePath, gradle);
          '
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$dir"
            if [ "$dir" = "mipmap-xxxhdpi" ]; then
              cp public/pwa-512x512.png "android/app/src/main/res/$dir/ic_launcher.png"
              cp public/pwa-512x512.png "android/app/src/main/res/$dir/ic_launcher_round.png"
            else
              cp public/pwa-192x192.png "android/app/src/main/res/$dir/ic_launcher.png"
              cp public/pwa-192x192.png "android/app/src/main/res/$dir/ic_launcher_round.png"
            fi
          done

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build Debug APK & Release AAB
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SAG-Race-Time.apk
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "$KEYSTORE_PASS" \
              -keypass "${KEY_PASS:-$KEYSTORE_PASS}" \
              "$AAB_PATH" "$KEY_ALIAS"
            cp "$AAB_PATH" app/build/outputs/bundle/release/SAG-Race-Time-signed.aab
            echo "AAB signed with release keystore"
          else
            cp "$AAB_PATH" app/build/outputs/bundle/release/SAG-Race-Time-unsigned.aab
            echo "AAB built (unsigned - add keystore secrets to sign for Play Store)"
          fi

      - name: Upload SAG Race Time APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAG-Race-Time-APK
          path: android/app/build/outputs/apk/debug/SAG-Race-Time.apk

      - name: Upload SAG Race Time AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAG-Race-Time-AAB
          path: android/app/build/outputs/bundle/release/SAG-Race-Time-*.aab
