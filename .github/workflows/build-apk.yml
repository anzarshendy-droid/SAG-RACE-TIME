name: Build SAG Race Time Android (APK & AAB)

on:
  workflow_dispatch:
    inputs:
      sync_server_url:
        description: 'URL server sinkronisasi opsional (kosongkan untuk Cloud Relay otomatis)'
        required: false
        default: ''
      version_name:
        description: 'Versi aplikasi (contoh: 1.0.0)'
        required: false
        default: '1.0.0'
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sudo mkdir -p "$SDK_DIR/licenses"
          sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-unpack
            rm -rf "$SDK_DIR/cmdline-tools/latest"
            mv /tmp/cmdline-unpack/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-unpack
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi
          chmod +x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_DIR/licenses/android-sdk-license"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          if [ ! -d "$SDK_DIR/platforms/android-34" ] || [ ! -d "$SDK_DIR/build-tools/34.0.0" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi
          set -o pipefail

      - name: Install dependencies & build web bundle
        env:
          VITE_API_URL: ${{ github.event.inputs.sync_server_url || vars.VITE_API_URL || '' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || '' }}
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run lint
          npm run build

      - name: Wrap with Capacitor & configure GPS/Sensor permissions
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
        run: |
          npm install --no-save --legacy-peer-deps --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/geolocation@6
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sag.racetime",
            "appName": "SAG Race Time",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          rm -rf android
          ./node_modules/.bin/cap add android
          ./node_modules/.bin/cap sync android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          node --input-type=module -e '
            import fs from "fs";
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            const perms = [
              "<uses-permission android:name=\"android.permission.INTERNET\" />",
              "<uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />",
              "<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />",
              "<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />",
              "<uses-permission android:name=\"android.permission.WAKE_LOCK\" />",
              "<uses-feature android:name=\"android.hardware.location.gps\" android:required=\"false\" />"
            ];
            for (const p of perms) {
              if (!xml.includes(p)) {
                xml = xml.replace("<application", p + "\n    <application");
              }
            }
            fs.writeFileSync(manifestPath, xml);

            const mainActivityPath = "android/app/src/main/java/com/sag/racetime/MainActivity.java";
            if (fs.existsSync(mainActivityPath)) {
              const activityCode = `package com.sag.racetime;

import android.Manifest;
import android.content.pm.PackageManager;
import android.os.Bundle;
import android.view.WindowManager;
import androidx.core.app.ActivityCompat;
import androidx.core.content.ContextCompat;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
  @Override
  public void onCreate(Bundle savedInstanceState) {
    super.onCreate(savedInstanceState);
    getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
    if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, 1001);
    }
  }
}
`;
              fs.writeFileSync(mainActivityPath, activityCode);
            }

            const gradlePath = "android/app/build.gradle";
            let gradle = fs.readFileSync(gradlePath, "utf8");
            const vCode = process.env.APP_VERSION_CODE || "1";
            const vName = process.env.APP_VERSION_NAME || "1.0.0";
            gradle = gradle
              .replace(/versionCode\s+\d+/, `versionCode ${vCode}`)
              .replace(/versionName\s+"[^"]*"/, `versionName "${vName}"`);
            fs.writeFileSync(gradlePath, gradle);
          '
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$dir"
            if [ "$dir" = "mipmap-xxxhdpi" ]; then
              cp public/pwa-512x512.png "android/app/src/main/res/$dir/ic_launcher.png"
              cp public/pwa-512x512.png "android/app/src/main/res/$dir/ic_launcher_round.png"
            else
              cp public/pwa-192x192.png "android/app/src/main/res/$dir/ic_launcher.png"
              cp public/pwa-192x192.png "android/app/src/main/res/$dir/ic_launcher_round.png"
            fi
          done

      - name: Build Debug APK & Release AAB
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SAG-Race-Time.apk
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "$KEYSTORE_PASS" \
              -keypass "${KEY_PASS:-$KEYSTORE_PASS}" \
              "$AAB_PATH" "$KEY_ALIAS"
            cp "$AAB_PATH" app/build/outputs/bundle/release/SAG-Race-Time-signed.aab
            echo "AAB signed with release keystore"
          else
            cp "$AAB_PATH" app/build/outputs/bundle/release/SAG-Race-Time-unsigned.aab
            echo "AAB built (unsigned - add keystore secrets to sign for Play Store)"
          fi

      - name: Upload SAG Race Time APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAG-Race-Time-APK
          path: android/app/build/outputs/apk/debug/SAG-Race-Time.apk

      - name: Upload SAG Race Time AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAG-Race-Time-AAB
          path: android/app/build/outputs/bundle/release/SAG-Race-Time-*.aab
