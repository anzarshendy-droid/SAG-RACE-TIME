name: Build SAG Race Time Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build web bundle
        env:
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
        run: |
          npm ci
          npm run build

      - name: Wrap with Capacitor & configure GPS/Sensor permissions
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "SAG Race Time" "com.sag.racetime" --web-dir dist
          npx cap add android
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            const perms = [
              "<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />",
              "<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />",
              "<uses-feature android:name=\"android.hardware.location.gps\" android:required=\"false\" />"
            ];
            for (const p of perms) {
              if (!xml.includes(p)) {
                xml = xml.replace("<application", p + "\n    <application");
              }
            }
            fs.writeFileSync(manifestPath, xml);
          '
          cp public/pwa-512x512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          cp public/pwa-192x192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload SAG Race Time APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAG-Race-Time-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
